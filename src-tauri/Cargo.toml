[package]
name = "orbit-shell"
version = "0.1.0"
description = "Orbit Shell — a lightweight Windows handheld console launcher"
authors = ["Orbit Shell"]
edition = "2021"

[lib]
name = "orbit_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
